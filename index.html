<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gift For You</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background-decorations">
      <img
        src="media/pinkflower.gif"
        class="flower"
        style="top: 15%; left: 10%; width: 50px"
      />
      <img
        src="media/purple flower.gif"
        class="flower"
        style="top: 10%; right: 30%; width: 45px"
      />
      <img
        src="media/pinkflower.gif"
        class="flower"
        style="top: 25%; right: 15%; width: 25px"
      />
      <img
        src="media/pinkflower.gif"
        class="flower"
        style="bottom: 20%; left: 8%; width: 45px"
      />
      <img
        src="media/purple flower.gif"
        class="flower"
        style="bottom: 10%; left: 30%; width: 40px"
      />
      <img
        src="media/pinkflower.gif"
        class="flower"
        style="bottom: 15%; right: 15%; width: 60px"
      />
    </div>

    <div class="container">
      <img
        src="media/02ce7945c01a4d62f78e480ca9c51f00.gif"
        class="bee"
        alt="Cute bee"
      />
      <h1>Are you ready for your gift, baby?</h1>
      <div class="buttons">
        <button id="noBtn" class="btn no-btn">hell naw</button>
        <button id="yesBtn" class="btn yes-btn">YES YES</button>
      </div>
    </div>

    <audio
      id="bgMusic"
      src="media/Sixpence None the Richer - Kiss Me (Instrumental Edit).mp3"
    ></audio>

    <script src="script.js"></script>
  </body>
</html>
